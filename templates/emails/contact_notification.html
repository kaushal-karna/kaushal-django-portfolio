<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New portfolio contact message</title>
</head>
<body style="margin:0;background:#080b16;color:#eef3ff;font-family:Arial,sans-serif;line-height:1.6;">
    <div style="padding:42px 18px;background:radial-gradient(circle at 85% 0%,#173b58,transparent 42%),#080b16;">
        <div style="max-width:620px;margin:0 auto;border:1px solid #27354e;border-radius:22px;overflow:hidden;background:#101629;">
            <div style="padding:28px 32px;border-bottom:1px solid #27354e;">
                <div style="color:#61e7ff;font-size:12px;font-weight:bold;letter-spacing:3px;">KAUSHAL.DEV / INBOX</div>
                <h1 style="margin:24px 0 10px;color:#ffffff;font-size:30px;line-height:1.15;">New message from {{ name }}</h1>
                <p style="margin:0;color:#9daac4;font-size:15px;">Someone reached out through your portfolio.</p>
            </div>
            <div style="padding:30px 32px;">
                <p style="margin:0 0 8px;color:#61e7ff;font-size:12px;font-weight:bold;letter-spacing:1px;">CONTACT</p>
                <p style="margin:0;color:#d8e1f2;"><strong>{{ name }}</strong> &lt;{{ email }}&gt;</p>
                <div style="margin:24px 0;padding:16px 18px;border-left:3px solid #61e7ff;background:#172038;color:#b9c7dd;"><strong style="color:#61e7ff;">Subject</strong><br>{{ subject|default:"No subject" }}</div>
                <p style="margin-bottom:8px;color:#61e7ff;font-size:12px;font-weight:bold;letter-spacing:1px;">MESSAGE</p>
                <div style="padding:18px;background:#0b1020;border:1px solid #27354e;border-radius:12px;color:#d8e1f2;white-space:pre-wrap;">{{ message }}</div>
                <a href="mailto:{{ email }}" style="display:inline-block;margin-top:24px;padding:12px 18px;border-radius:10px;background:#61e7ff;color:#07101b;font-weight:bold;text-decoration:none;">Reply to {{ name }} &rarr;</a>
            </div>
            <div style="padding:22px 32px;border-top:1px solid #27354e;color:#72809a;font-size:12px;">This notification was generated by your portfolio contact form.</div>
        </div>
    </div>
</body>
</html>
